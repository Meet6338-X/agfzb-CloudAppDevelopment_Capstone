name: 'Lint Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs: # list of things to do
  lint_function_js:
    name: Linting JavaScript Function
    runs-on: ubuntu-latest
    steps: # list of steps
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Code Checkout
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install
        working-directory: functions/sample/nodejs

      - name: Code Linting
        run: npm run lint
        working-directory: functions/sample/nodejs

  lint_dealership_function_js:
    name: Linting Dealership Cloud Function
    runs-on: ubuntu-latest
    steps:
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Code Checkout
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install
        working-directory: functions

      - name: Code Linting
        run: npm run lint
        working-directory: functions

  lint_function_python:
    name: Linting Python Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with Pylint
        run: pylint *.py
        working-directory: functions/sample/python

  lint_reviews_function_python:
    name: Linting Reviews Cloud Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with Pylint
        run: pylint *.py
        working-directory: functions

  lint_django_server:
    name: Linting Django Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with Pylint
        run: pylint *.py
        working-directory: server

  lint_django_app:
    name: Linting Django Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r server/requirements.txt
      - name: Lint with Pylint
        run: pylint djangoapp djangobackend
        working-directory: server

  containerize:
    name: Build the application container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Build the Docker image
        run: docker build -t dealership:latest server/
      - name: Check that the image exposes the application port
        run: docker image inspect dealership:latest --format '{{.Config.ExposedPorts}}'
